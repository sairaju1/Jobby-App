<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="log-container">
        <div class="log-card">
            <h1 class="log-head">LOGIN</h1>
            <form id="loginForm">
                <label for="EmailId" class="label">Email</label>
                <input type="email" class="input" id="emailInput" required> 
            
                <div class="mb-3">
                    <div class="d-flex flex-row align-items-center">
                        <input type="password" id="passwordInput" placeholder="PASSWORD" class="input" required>
                        <i id="togglePassword" class="fas fa-eye-slash email-icon"></i>
                    </div>
                    <p id="loginErrMsg" class="error-message"></p>
                </div>
            
                <button type="submit" class="button-1">LOGIN</button>
                <p id="loginerror"></p>
            </form>
            

            <br>
            <a href="log.html">Forgot password?</a>

            <div class="d-flex flex-row">
                <hr class="line">
                <p class="or">or</p>
                <hr class="line-2">
            </div>
            <div class="d-flex flex-row justify-content-center">
                <a href="https://accounts.google.com" target="_blank" class="mx-2">
                    <i class="fab fa-google google-icon"></i>
                </a>
                <a href="https://www.facebook.com" target="_blank" class="mx-2">
                    <i class="fab fa-facebook-f facebook-icon"></i>
                </a>
                <a href="https://www.linkedin.com" target="_blank" class="mx-2">
                    <i class="fab fa-linkedin-in linkedin-icon"></i>
                </a>
            </div>
            <P class="para-2">Need an account? <a href="sign.html"><span class="span-1">SIGN UP</span></a></P>
        </div>
    </div>

    <script>
        document.getElementById("togglePassword").addEventListener("click", function () {
            const passwordInput = document.getElementById("passwordInput");
            const icon = this;
    
            if (passwordInput.type === "password") {
                passwordInput.type = "text"; 
                icon.classList.remove("fa-eye-slash"); 
                icon.classList.add("fa-eye");
            } else {
                passwordInput.type = "password"; 
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            }
        });
    
        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault(); 
    
            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value.trim();
            const loginErrMsg = document.getElementById("loginErrMsg");
            const loginerror=document.getElementById("loginerror");
    
            loginErrMsg.textContent = ""; 
    
            try {
                const response = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });
    
                const data = await response.json();
    
                if (response.status === 401) {
                    loginErrMsg.textContent = "Invalid email or password!";
                } else if (response.ok) {
                    alert("Login successful!");
                    window.location.href = "wikipedia-application.html"; 
                } else {
                    loginErrMsg.textContent = "Login failed. Please try again.";
                }
            } catch (error) {
                console.error("Error logging in:", error);
                loginErrMsg.textContent = "Server error. Try again later.";
                loginerror.classList.add("error-message");
            }
        });
    </script>
    
</body>
</html>
