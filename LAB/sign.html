<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="sign.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
    <div class="bg-container">
        <div class="shadow card-container">
            <h1 class="main-head">SIGNUP</h1>
            <p>Sign up to continue</p>
            <form id="signupForm">
                <div class="mb-3">
                    <input type="text" id="nameInput" placeholder="NAME" class="input">
                    <p id="nameErrMsg" class="error-message"></p>
                </div>
                <div class="mb-3">
                    <input type="email" id="emailInput" placeholder="EMAIL" class="input">
                    <p id="emailErrMsg" class="error-message"></p>
                </div>
                <div class="mb-3">
                    <div class="d-flex flex-row align-items-center">
                        <input type="password" id="passwordInput" placeholder="PASSWORD" class="input">
                        <i id="togglePassword" class="fas fa-eye-slash email-icon"></i>
                    </div>
                    <p id="passwordErrMsg" class="error-message"></p>
                </div>    

                <button class="btn btn-primary" type="submit">Sign Up</button>
                <br>
                <p>Already have an account? <a href="login.html"><span>Log in</span></a></p>
                
                <div class="d-flex flex-row">
                    <hr class="line">
                    <p class="or">or</p>
                    <hr class="line">
                </div>

                <div>
                    <a href="https://accounts.google.com" target="_blank">
                        <i class="fab fa-google google-icon"></i>
                        <button type="button" class="button-1">Sign Up With Google</button>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById("togglePassword").addEventListener("click", function () {
            const passwordInput = document.getElementById("passwordInput");
            const icon = this;

            if (passwordInput.type === "password") {
                passwordInput.type = "text"; 
                icon.classList.remove("fa-eye-slash"); 
                icon.classList.add("fa-eye");
            } else {
                passwordInput.type = "password"; 
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            }
        });

        const signupForm = document.getElementById("signupForm");
        const nameInput = document.getElementById("nameInput");
        const emailInput = document.getElementById("emailInput");
        const passwordInput = document.getElementById("passwordInput");

        const nameErrMsg = document.getElementById("nameErrMsg");
        const emailErrMsg = document.getElementById("emailErrMsg");
        const passwordErrMsg = document.getElementById("passwordErrMsg");

        signupForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            // Clear previous errors
            nameErrMsg.textContent = "";
            emailErrMsg.textContent = "";
            passwordErrMsg.textContent = "";

            let isValid = true;

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Name validation
            if (!name) {
                nameErrMsg.textContent = "Required*";
                isValid = false;
            }

            // Email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) {
                emailErrMsg.textContent = "Required*";
                isValid = false;
            } else if (!emailPattern.test(email)) {
                emailErrMsg.textContent = "Invalid email format";
                isValid = false;
            }

            // Password validation
            const specialCharRegex = /[!@#$%^&*(),.?":{}|<>]/;
            if (!password) {
                passwordErrMsg.textContent = "Required*";
                isValid = false;
            } else if (password.length < 8) {
                passwordErrMsg.textContent = "Password must be at least 8 characters long";
                isValid = false;
            } else if (!specialCharRegex.test(password)) {
                passwordErrMsg.textContent = "Password must contain at least one special character";
                isValid = false;
            }

            if (!isValid) return;

            // Sending form data to backend
            try {
                const response = await fetch("http://localhost:3000/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.status === 400) {
                    emailErrMsg.textContent = "Email already registered!";
                } else if (response.ok) {
                    alert("User registered successfully!");
                    window.location.href = "login.html";
                } else {
                    alert("Registration failed!");
                }
            } catch (error) {
                console.error("Error submitting form:", error);
            }
        });
    </script>
</body>
</html>
